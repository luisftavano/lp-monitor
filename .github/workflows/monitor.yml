name: LP monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min
  workflow_dispatch:          # botão pra rodar manualmente
    inputs:
      modo:
        description: "teste = só checa conexão e manda alerta"
        type: choice
        options: [normal, teste]
        default: normal

permissions:
  contents: write             # pra salvar o state.json

concurrency:
  group: lp-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Checar posição
        run: python monitor.py
        env:
          MODE: ${{ inputs.modo || 'normal' }}
          POSITION_ID: ${{ vars.POSITION_ID }}
          INITIAL_BASE: ${{ vars.INITIAL_BASE }}
          INITIAL_QUOTE: ${{ vars.INITIAL_QUOTE }}
          EDGE_PCT: ${{ vars.EDGE_PCT || '5' }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR || '9' }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salvar estado
        run: |
          git config user.name "lp-monitor"
          git config user.email "lp-monitor@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet || (git commit -m "estado" && git push)
